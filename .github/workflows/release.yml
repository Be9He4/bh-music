name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build release APK (unsigned)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Decode signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 -d > android/bh-music-release.jks
          chmod 600 android/bh-music-release.jks

      - name: ZipAlign + sign APK
        working-directory: ./android
        env:
          KS_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          set -e
          BT_DIR="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | tail -1)"
          [ -z "$BT_DIR" ] && { echo "build-tools not found"; exit 1; }
          APK_DIR="app/build/outputs/apk/release"
          RAW="$(find "$APK_DIR" -maxdepth 1 -type f -name '*-release.apk' ! -name '*-signed*' | head -n1)"
          [ -z "$RAW" ] && { echo "unsigned release APK not found"; ls -la "$APK_DIR"; exit 1; }
          ALIGNED="$APK_DIR/app-temp-aligned.apk"
          FINAL="${RAW%-release.apk}-signed.apk"
          "$BT_DIR/zipalign" -f -p 4 "$RAW" "$ALIGNED"
          "$BT_DIR/apksigner" sign \
            --ks bh-music-release.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$FINAL" "$ALIGNED"
          "$BT_DIR/apksigner" verify -v "$FINAL"
          rm -f "$ALIGNED"
          echo "Signed APK: $FINAL"

      - name: Upload signed APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bh-music-signed-apk
          path: android/app/build/outputs/apk/release/*-signed.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            android/app/build/outputs/apk/release/*-signed.apk \
            --generate-notes \
            --title "BH Music $GITHUB_REF_NAME"
